<!DOCTYPE html>
<html lang="ko">
<head>

<title>임원 골프예약</title>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4.4.1/dist/email.min.js"></script>
<script>
// ════════════════════════════════════════════════════════════
//  ▼▼▼ 설정 — 이 블록만 수정하면 됩니다 ▼▼▼

const CONFIG = {

  // EmailJS (Account > Public Key / Email Services / Email Templates)

  EMAILJS_TEMPLATE_ID: 'YOUR_EMAILJS_TEMPLATE_ID',

  // 메일 수신자
  CEO_NAME:    '유성완',                 // 대표님 (확정/불가 알림 수신)
  CEO_EMAIL:   'ysw0607@hecto.co.kr',
  ADMIN_NAME:  '함기식',                 // 예약 담당 (희망일정 알림 수신)
  ADMIN_EMAIL: 'kmon@hecto.co.kr',

  // 관리자 화면 주소: PAGE_URL?admin=<ADMIN_KEY>
  ADMIN_KEY: 'hecto-golf',

  // 월 한도
  LIMITS: { weekday: 7, saturday: 2, sunday: 3 },

  // 달력 시작 월
  START: { year: 2026, month: 8 },
};
// ════════════════════════════════════════════════════════════
</script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; background: #f4f6f9; color: #1a2535; min-height: 100vh; padding: 28px 24px; }
  button { font-family: inherit; }

  .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; flex-wrap: wrap; gap: 12px; }
  .header-left h1 { font-size: 20px; font-weight: 700; letter-spacing: -0.5px; }

  .header-right { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .badge { font-size: 11px; padding: 4px 11px; border-radius: 20px; font-weight: 600; }
  .role-ceo   { background: #eef2ff; color: #3949ab; }
  .role-admin { background: #1a2535; color: #fff; }
  .role-demo  { background: #fff3e0; color: #e65100; }
  .sync-ok  { background: #e8f5e9; color: #2e7d32; }
  .sync-err { background: #fdecea; color: #c62828; }
  .sync-ing { background: #fff8e1; color: #f57f17; }

  .month-nav { display: flex; align-items: center; justify-content: center; background: #fff; border: 1px solid #e4eaf2; border-radius: 14px; padding: 14px 20px; margin-bottom: 22px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
  .nav-btn { background: none; border: 1.5px solid #e4eaf2; border-radius: 8px; width: 34px; height: 34px; cursor: pointer; font-size: 16px; color: #4a6070; display: flex; align-items: center; justify-content: center; }
  .nav-btn:hover { background: #f0f4f8; }
  .nav-btn:disabled { opacity: 0.3; cursor: default; }
  .month-label { font-size: 22px; font-weight: 800; margin: 0 20px; min-width: 160px; text-align: center; letter-spacing: -0.5px; }
  .month-pills { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; margin: 0 16px; }
  .month-pill { background: #f0f4f8; border: 1.5px solid transparent; border-radius: 20px; padding: 4px 12px; font-size: 12px; font-weight: 600; color: #7a8fa6; cursor: pointer; white-space: nowrap; }
  .month-pill:hover { background: #e4eaf2; color: #4a6070; }
  .month-pill.active { background: #1a2535; color: #fff; }

  .pending-banner { display: none; background: #fff8e1; border: 1px solid #ffe08a; border-radius: 13px; padding: 14px 18px; margin-bottom: 18px; }
  .pending-banner.show { display: block; }
  .pending-banner h4 { font-size: 13px; color: #8a5a00; margin-bottom: 8px; }
  .pending-item { display: inline-flex; align-items: center; gap: 6px; background: #fff; border: 1px solid #ffe08a; border-radius: 8px; padding: 5px 10px; margin: 3px 6px 3px 0; font-size: 12px; cursor: pointer; }

  .kpi-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 18px; }
  .kpi-card { background: #fff; border: 1px solid #e4eaf2; border-radius: 13px; padding: 16px 18px; position: relative; overflow: hidden; box-shadow: 0 2px 6px rgba(0,0,0,0.04); }
  .kpi-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; }
  .kpi-card.green::before  { background: linear-gradient(90deg,#27ae60,#2ecc71); }
  .kpi-card.blue::before   { background: linear-gradient(90deg,#2980b9,#3498db); }
  .kpi-card.orange::before { background: linear-gradient(90deg,#e67e22,#f39c12); }
  .kpi-card.purple::before { background: linear-gradient(90deg,#8e44ad,#9b59b6); }
  .kpi-label { font-size: 10px; color: #9aabb8; letter-spacing: 0.8px; margin-bottom: 7px; }
  .kpi-value { font-size: 30px; font-weight: 800; line-height: 1; }
  .kpi-value span { font-size: 13px; font-weight: 500; color: #9aabb8; margin-left: 2px; }
  .kpi-sub { font-size: 11px; color: #b0bec5; margin-top: 5px; }

  .quota-card { background: #fff; border: 1px solid #e4eaf2; border-radius: 13px; padding: 18px 20px; box-shadow: 0 2px 6px rgba(0,0,0,0.04); margin-bottom: 24px; }
  .quota-title { font-size: 12px; font-weight: 600; color: #4a6070; margin-bottom: 14px; display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
  .quota-title .note { font-weight: 400; color: #9aabb8; font-size: 11px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
  .quota-item { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .quota-item:last-child { margin-bottom: 0; }
  .quota-item-label { width: 44px; font-size: 11px; color: #9aabb8; font-weight: 600; }
  .quota-bar-wrap { flex: 1; background: #f0f4f8; border-radius: 6px; height: 8px; overflow: hidden; display: flex; }
  .quota-bar-fill { height: 100%; transition: width 0.5s; }
  .fill-weekday  { background: #2980b9; } .fill-saturday { background: #16a085; } .fill-sunday { background: #e74c3c; }
  .fill-pending  { background: repeating-linear-gradient(45deg,#f5c26b,#f5c26b 4px,#fbe2b0 4px,#fbe2b0 8px); }
  .quota-nums { font-size: 11px; font-weight: 600; white-space: nowrap; min-width: 92px; text-align: right; }
  .quota-nums .used { color: #1a2535; } .quota-nums .total { color: #b0bec5; } .quota-nums .pend { color: #d68910; }

  .section-title { font-size: 12px; font-weight: 700; color: #4a6070; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
  .section-title::after { content: ''; flex: 1; height: 1px; background: #e4eaf2; }
  .legend { display: flex; gap: 12px; font-size: 11px; color: #7a8fa6; margin-bottom: 8px; flex-wrap: wrap; }

  .calendar-wrap { background: #fff; border: 1px solid #e4eaf2; border-radius: 13px; overflow: hidden; margin-bottom: 24px; box-shadow: 0 2px 6px rgba(0,0,0,0.04); }
  .cal-header, .cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }
  .cal-header { border-bottom: 1px solid #e4eaf2; }

  .cal-cell:hover { background: #f8fafc; }
  .cal-cell:nth-child(7n) { border-right: none; }
  .cal-cell.empty { background: #fbfcfd; cursor: default; }
  .cal-cell.past { background: #fafbfc; }
  .cal-day { font-size: 12px; font-weight: 700; margin-bottom: 4px; }
  .cal-cell.sun .cal-day { color: #e74c3c; } .cal-cell.sat .cal-day { color: #2980b9; }
  .cal-cell.today .cal-day { color: #fff; background: #27ae60; display: inline-block; border-radius: 10px; padding: 0 6px; }
  .cal-cell.holiday { background: #fff5f5; }
  .cal-cell.holiday .cal-day { color: #c0392b; }
  .holiday-label { display: inline-block; font-size: 9px; font-weight: 700; color: #fff; background: #e74c3c; border-radius: 4px; padding: 1px 5px; margin-left: 3px; vertical-align: 1px; }
  .add-btn { position: absolute; bottom: 4px; right: 4px; width: 18px; height: 18px; border-radius: 50%; background: #e8f5e9; color: #27ae60; font-size: 14px; line-height: 18px; text-align: center; font-weight: 700; border: none; cursor: pointer; display: none; }
  .cal-cell:hover .add-btn { display: block; }

  .pill { border-radius: 6px; padding: 3px 6px; margin-bottom: 3px; cursor: pointer; overflow: hidden; }
  .pill .t { font-size: 9px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pill .n { font-size: 10px; font-weight: 600; margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .st-confirmed  { background: #eaf7f0; border: 1px solid #a9dfbf; color: #1a5e34; }
  .st-requested  { background: #fff8e6; border: 1.5px dashed #f0b44c; color: #8a5a00; }
  .st-declined   { background: #f4f5f7; border: 1px solid #dde2e8; color: #9aa5b1; text-decoration: line-through; }
  .st-cancel_req { background: #fdecea; border: 1.5px dashed #e57373; color: #b71c1c; }
  .pill:hover { filter: brightness(0.96); }

  .list-wrap { background: #fff; border: 1px solid #e4eaf2; border-radius: 13px; overflow-x: auto; box-shadow: 0 2px 6px rgba(0,0,0,0.04); }
  .list-table { width: 100%; border-collapse: collapse; min-width: 640px; }
  .list-table thead tr { background: #f8fafc; }
  .list-table th { padding: 11px 14px; text-align: left; font-size: 10px; font-weight: 700; color: #9aabb8; border-bottom: 1px solid #e4eaf2; white-space: nowrap; }
  .list-table td { padding: 10px 14px; font-size: 12px; color: #3a4f60; border-bottom: 1px solid #f0f4f8; }
  .list-table tbody tr { cursor: pointer; }
  .list-table tbody tr:hover td { background: #f8fafc; }
  .tag { display: inline-block; font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 10px; white-space: nowrap; }
  .type-weekday  { background: #dbeeff; color: #1a6fa8; }
  .type-saturday { background: #d5f5ef; color: #0e6655; }
  .type-sunday   { background: #fde8e8; color: #c0392b; }
  .tag.st-confirmed, .tag.st-requested, .tag.st-declined, .tag.st-cancel_req { border-width: 1px; text-decoration: none; }
  .muted { color: #b0bec5; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.35); z-index: 1000; align-items: center; justify-content: center; padding: 16px; }
  .modal-overlay.open { display: flex; }
  .modal { background: #fff; border-radius: 16px; padding: 24px 26px; width: 380px; max-width: 100%; max-height: 92vh; overflow-y: auto; box-shadow: 0 12px 40px rgba(0,0,0,0.15); }
  .modal h3 { font-size: 15px; font-weight: 700; margin-bottom: 6px; }
  .modal .status-line { margin-bottom: 16px; font-size: 11px; color: #7a8fa6; }
  .modal label { display: block; font-size: 11px; font-weight: 600; color: #7a8fa6; margin-bottom: 4px; }
  .modal input, .modal select, .modal textarea { width: 100%; padding: 9px 12px; border: 1.5px solid #d8e4ee; border-radius: 8px; font-size: 14px; color: #1a2535; margin-bottom: 12px; outline: none; font-family: inherit; }
  .modal textarea { resize: vertical; min-height: 56px; }
  .modal input:focus, .modal select:focus, .modal textarea:focus { border-color: #27ae60; }
  .modal input[readonly] { background: #f8fafc; color: #7a8fa6; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin: -6px 0 12px; }
  .chip { background: #f0f4f8; border: none; border-radius: 14px; padding: 4px 10px; font-size: 11px; color: #4a6070; cursor: pointer; }
  .chip:hover { background: #dfe7ef; }
  .info-box { background: #f8fafc; border-radius: 8px; padding: 10px 12px; font-size: 12px; color: #4a6070; margin-bottom: 12px; line-height: 1.6; }
  .warn-box { background: #fff3e0; border-radius: 8px; padding: 8px 12px; font-size: 11px; color: #a04000; margin-bottom: 12px; }
  .modal-btns { display: flex; gap: 8px; margin-top: 4px; flex-wrap: wrap; }
  .modal-btns button { flex: 1; min-width: 90px; border: none; border-radius: 9px; padding: 11px; font-size: 13px; font-weight: 700; cursor: pointer; }
  .b-primary { background: #27ae60; color: #fff; } .b-primary:hover { background: #1e8449; }
  .b-warn    { background: #fdecea; color: #c0392b; } .b-warn:hover { background: #c0392b; color: #fff; }
  .b-plain   { background: #f0f4f8; color: #4a6070; }
  .b-blue    { background: #d5e8f7; color: #1a6fa8; } .b-blue:hover { background: #1a6fa8; color: #fff; }
  .modal-btns button:disabled { opacity: .5; cursor: default; }

  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(20px); background: #1a2535; color: #fff; padding: 10px 18px; border-radius: 10px; font-size: 13px; opacity: 0; transition: all .25s; z-index: 2000; pointer-events: none; max-width: calc(100% - 32px); }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  @media (max-width: 900px) {
    .kpi-row { grid-template-columns: repeat(2,1fr); }
    .month-label { font-size: 17px; min-width: 120px; margin: 0 10px; }
  }
  @media (max-width: 600px) {
    body { padding: 16px; }
    .month-pills { display: none; }
    .cal-cell { min-height: 70px; padding: 4px 3px 18px; }
    .pill { padding: 2px 3px; }
    .pill .n { display: none; }
    .holiday-label { display: none; }
    .kpi-value { font-size: 24px; }
    .add-btn { display: none !important; }
  }
</style>

<body>

<div class="header">
  <div class="header-left">
    <h1 id="page-title">⛳ 임원 골프예약 현황</h1>
    <div class="subtitle" id="page-sub"></div>
  </div>
  <div class="header-right">
    <span class="badge" id="role-badge"></span>
    <span class="badge sync-ing" id="sync-status">● 연결 중...</span>
  </div>
</div>

<div class="month-nav">
  <button class="nav-btn" id="btn-prev" onclick="changeMonth(-1)" aria-label="이전 달">‹</button>
  <div class="month-label" id="month-label"></div>
  <button class="nav-btn" id="btn-next" onclick="changeMonth(1)" aria-label="다음 달">›</button>
  <div class="month-pills" id="month-pills"></div>
</div>

<div class="pending-banner" id="pending-banner">
  <h4 id="pending-title"></h4>
  <div id="pending-list"></div>
</div>

<div class="kpi-row">
  <div class="kpi-card green">
    <div class="kpi-label">확정 예약</div>
    <div class="kpi-value" id="kpi-total">0 <span>건</span></div>
    <div class="kpi-sub" id="kpi-sub"></div>
  </div>
  <div class="kpi-card blue">
    <div class="kpi-label" id="kpi-wd-label">주중 잔여</div>
    <div class="kpi-value" id="kpi-wd">0 <span>회</span></div>
    <div class="kpi-sub" id="kpi-wd-sub"></div>
  </div>
  <div class="kpi-card orange">
    <div class="kpi-label" id="kpi-sat-label">토요일 잔여</div>
    <div class="kpi-value" id="kpi-sat">0 <span>회</span></div>
    <div class="kpi-sub" id="kpi-sat-sub"></div>
  </div>
  <div class="kpi-card purple">
    <div class="kpi-label" id="kpi-sun-label">일요일/공휴일 잔여</div>
    <div class="kpi-value" id="kpi-sun">0 <span>회</span></div>
    <div class="kpi-sub" id="kpi-sun-sub"></div>

<div class="quota-card">
  <div class="quota-title"><span class="dot" style="background:#27ae60"></span>월 한도 사용 현황 <span class="note">· 진한 색 = 확정, 빗금 = 희망(대기)</span></div>

</div>

<div class="section-title" id="cal-section-title"></div>
<div class="legend">
  <span><i style="background:#fff8e6;border:1.5px dashed #f0b44c"></i>희망(예약 대기)</span>
  <span><i style="background:#eaf7f0;border:1px solid #a9dfbf"></i>확정</span>
  <span><i style="background:#fdecea;border:1.5px dashed #e57373"></i>취소 요청</span>
  <span><i style="background:#f4f5f7;border:1px solid #dde2e8"></i>예약 불가</span>
</div>
<div class="calendar-wrap">
  <div class="cal-header">
    <div class="cal-header-cell sun">일</div><div class="cal-header-cell">월</div><div class="cal-header-cell">화</div>
    <div class="cal-header-cell">수</div><div class="cal-header-cell">목</div><div class="cal-header-cell">금</div>
    <div class="cal-header-cell sat">토</div>

<div class="section-title">예약 상세 목록</div>
<div class="list-wrap">
  <table class="list-table">
    <thead><tr><th>#</th><th>날짜</th><th>요일</th><th>구분</th><th>상태</th><th>티타임 / 희망</th><th>예약자</th><th>메모</th></tr></thead>
    <tbody id="list-body"></tbody>
  </table>

<div style="text-align:right; font-size:10px; color:#c0cdd8; margin-top:16px;" id="footer"></div>

<div class="modal-overlay" id="modal-overlay">
  <div class="modal" id="modal" role="dialog" aria-modal="true"></div>
</div>
<div class="toast" id="toast"></div>

<script>
// ── 기본 상수 ────────────────────────────────────────────
const DAY_KR = ['일','월','화','수','목','금','토'];
const TYPE_KR = { weekday: '주중', saturday: '토요일', sunday: '일/공휴일' };
const STATUS_KR = { requested: '희망 (예약 대기)', confirmed: '확정', declined: '예약 불가', cancel_req: '취소 요청' };
const STATUS_SHORT = { requested: '희망', confirmed: '확정', declined: '불가', cancel_req: '취소요청' };

const params = new URLSearchParams(location.search);
const IS_ADMIN = params.get('admin') === CONFIG.ADMIN_KEY;
const DEMO = CONFIG.SUPABASE_URL.startsWith('YOUR');
const EMAIL_ON = !CONFIG.EMAILJS_PUBLIC_KEY.startsWith('YOUR') && typeof emailjs !== 'undefined';
if (EMAIL_ON) emailjs.init({ publicKey: CONFIG.EMAILJS_PUBLIC_KEY });

// 대한민국 공휴일 (필요 시 연도 추가)
const HOLIDAYS = {
  '2026-9':  {24:'추석연휴', 25:'추석', 26:'추석연휴'},
  '2026-10': {3:'개천절', 5:'대체공휴일', 9:'한글날'},
  '2026-12': {25:'크리스마스'},
  '2027-1':  {1:'신정'},
  '2027-2':  {6:'설연휴', 7:'설날', 8:'설연휴', 9:'대체공휴일'},
  '2027-3':  {1:'삼일절'},
  '2027-5':  {5:'어린이날', 13:'부처님오신날'},
  '2027-6':  {6:'현충일'},
  '2027-8':  {15:'광복절', 16:'대체공휴일'},
  '2027-9':  {14:'추석연휴', 15:'추석', 16:'추석연휴'},
  '2027-10': {3:'개천절', 4:'대체공휴일', 9:'한글날', 11:'대체공휴일'},
  '2027-12': {25:'크리스마스', 27:'대체공휴일'},
};
const getHoliday = (y, m, d) => (HOLIDAYS[`${y}-${m}`] || {})[d] || null;
const daysInMonth = (y, m) => new Date(y, m, 0).getDate();
const getDow = (y, m, d) => new Date(y, m - 1, d).getDay();
const autoType = (y, m, d) => { const w = getDow(y, m, d); return w === 6 ? 'saturday' : (w === 0 || getHoliday(y, m, d)) ? 'sunday' : 'weekday'; };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dateStr = (y, m, d) => `${m}/${d}(${DAY_KR[getDow(y, m, d)]})`;

// ── 월 범위: 시작월 ~ (오늘 + 14개월) ────────────────────
const MONTHS = [];
(() => {
  const now = new Date();
  const endKey = now.getFullYear() * 12 + now.getMonth() + 14;
  let y = CONFIG.START.year, m = CONFIG.START.month;
  while (y * 12 + (m - 1) <= endKey) { MONTHS.push({ year: y, month: m }); m++; if (m > 12) { m = 1; y++; } }
})();
let curIdx = (() => { const n = new Date(); const i = MONTHS.findIndex(x => x.year === n.getFullYear() && x.month === n.getMonth() + 1); return i >= 0 ? i : MONTHS.length - 1; })();
let rows = [];

// ── 데이터 계층 (Supabase / 데모) ───────────────────────
const API = `${CONFIG.SUPABASE_URL}/rest/v1/reservations`;
const HDR = { apikey: CONFIG.SUPABASE_KEY, Authorization: `Bearer ${CONFIG.SUPABASE_KEY}`, 'Content-Type': 'application/json', Prefer: 'return=representation' };

const supaDB = {
  async list(y, m) {
    const r = await fetch(`${API}?year=eq.${y}&month=eq.${m}&order=day.asc,created_at.asc`, { headers: HDR });
    if (!r.ok) throw new Error(r.status); return r.json();
  },
  async insert(d) {
    const r = await fetch(API, { method: 'POST', headers: HDR, body: JSON.stringify(d) });
    if (!r.ok) throw new Error(await r.text()); return (await r.json())[0];
  },
  async update(id, d) {
    const r = await fetch(`${API}?id=eq.${id}`, { method: 'PATCH', headers: HDR, body: JSON.stringify({ ...d, updated_at: new Date().toISOString() }) });
    if (!r.ok) throw new Error(await r.text()); return (await r.json())[0];
  },
  async remove(id) {
    const r = await fetch(`${API}?id=eq.${id}`, { method: 'DELETE', headers: HDR });
    if (!r.ok) throw new Error(await r.text());
  },
};

// 데모 모드: 설정 전에도 화면/흐름을 미리 볼 수 있도록 브라우저에만 저장
const demoDB = (() => {
  let mem = null;
  const load = () => {
    if (mem) return mem;
    try { mem = JSON.parse(localStorage.getItem('golf_demo') || 'null'); } catch (e) {}
    if (!mem) {
      const n = new Date(), y = n.getFullYear(), m = n.getMonth() + 1;
      mem = [
        { id: 1, year: y, month: m, day: 3, type: autoType(y, m, 3), status: 'confirmed', time: '08시00분', name: CONFIG.CEO_NAME },
        { id: 2, year: y, month: m, day: 17, type: autoType(y, m, 17), status: 'requested', req_time: '오전', req_note: '4인', name: CONFIG.CEO_NAME },
        { id: 3, year: y, month: m, day: 24, type: autoType(y, m, 24), status: 'confirmed', time: '12시00분', name: CONFIG.CEO_NAME },
      ];
    }
    return mem;
  };
  const save = () => { try { localStorage.setItem('golf_demo', JSON.stringify(mem)); } catch (e) {} };
  return {
    async list(y, m) { return load().filter(r => r.year === y && r.month === m).sort((a, b) => a.day - b.day); },
    async insert(d) { const all = load(); const row = { ...d, id: Math.max(0, ...all.map(r => r.id)) + 1, created_at: new Date().toISOString() }; all.push(row); save(); return row; },
    async update(id, d) { const r = load().find(x => x.id === id); Object.assign(r, d); save(); return r; },
    async remove(id) { mem = load().filter(r => r.id !== id); save(); },
  };
})();
const DB = DEMO ? demoDB : supaDB;

// ── 메일 ─────────────────────────────────────────────────
// to: 'ceo' | 'admin'
async function notify(to, subject, lines) {
  const toName  = to === 'ceo' ? CONFIG.CEO_NAME : CONFIG.ADMIN_NAME;
  const toEmail = to === 'ceo' ? CONFIG.CEO_EMAIL : CONFIG.ADMIN_EMAIL;
  const link = to === 'admin' ? `${CONFIG.PAGE_URL}?admin=${CONFIG.ADMIN_KEY}` : CONFIG.PAGE_URL;
  const message = lines.filter(Boolean).join('\n');
  const label = to === 'ceo' ? '대표님' : '담당자';
  if (!EMAIL_ON) { console.log('[메일 미설정]', toEmail, subject, '\n' + message); toast(`(메일 미설정) ${label}께 알림 생략`); return; }
  try {
    await emailjs.send(CONFIG.EMAILJS_SERVICE_ID, CONFIG.EMAILJS_TEMPLATE_ID, {
      to_email: toEmail, to_name: toName, subject: `[골프예약] ${subject}`, message, page_url: link,
      from_name: `${CONFIG.COURSE_NAME} 골프예약`,
    });
    toast(`✉ ${label}께 알림메일 발송`);
  } catch (e) { console.warn('메일 발송 실패', e); toast('⚠ 메일 발송 실패 (예약 저장은 완료)'); }
}
function describe(r) {
  const { year, month } = MONTHS[curIdx];
  return [
    `일자: ${year}년 ${month}월 ${r.day}일 (${DAY_KR[getDow(year, month, r.day)]}) · ${TYPE_KR[r.type]}`,
    `골프장: ${CONFIG.COURSE_NAME}`,
    r.time     ? `티타임: ${r.time}` : null,
    r.req_time ? `희망 시간대: ${r.req_time}` : null,
    r.name     ? `예약자: ${r.name}` : null,
    r.req_note ? `요청 메모: ${r.req_note}` : null,
    r.admin_note ? `담당자 메모: ${r.admin_note}` : null,
  ];
}

// ── 공통 UI ──────────────────────────────────────────────
let toastTimer;
function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2600); }
function setSync(s) {
  const el = document.getElementById('sync-status');
  if (DEMO) { el.className = 'badge role-demo'; el.textContent = '● 데모 모드 (DB 미설정)'; return; }
  el.className = 'badge ' + ({ ok: 'sync-ok', err: 'sync-err', ing: 'sync-ing' })[s];
  el.textContent = ({ ok: '● DB 연결됨', err: '● 연결 오류', ing: '● 동기화 중...' })[s];
}

function initHeader() {
  document.title = `${CONFIG.COURSE_NAME} 임원 골프예약`;
  document.getElementById('page-title').textContent = `⛳ ${CONFIG.COURSE_NAME} 임원 골프예약 현황`;
  document.getElementById('page-sub').textContent = IS_ADMIN
    ? '희망일정 클릭 → 확정/불가 처리 · 날짜 클릭 → 확정 예약 직접 등록 · 30초 자동 동기화'
    : '날짜 클릭 → 희망일정 등록 · 예약 클릭 → 상세/수정 · 30초 자동 동기화';
  const b = document.getElementById('role-badge');
  b.className = 'badge ' + (IS_ADMIN ? 'role-admin' : 'role-ceo');
  b.textContent = IS_ADMIN ? `관리자 · ${CONFIG.ADMIN_NAME}` : '대표님 화면';
  document.getElementById('footer').textContent = `${CONFIG.COURSE_NAME} 임원 전용 골프예약 시스템`;
}

// ── 월 이동 ──────────────────────────────────────────────
function renderMonthPills() {
  const wrap = document.getElementById('month-pills'); wrap.innerHTML = '';
  const cy = MONTHS[curIdx].year;
  MONTHS.forEach((mo, i) => {
    if (mo.year !== cy) return;
    const p = document.createElement('button');
    p.className = 'month-pill' + (i === curIdx ? ' active' : '');
    p.textContent = `${mo.month}월`;
    p.onclick = () => { curIdx = i; onMonthChange(); };
    wrap.appendChild(p);
  });
}
function onMonthChange() {
  const { year, month } = MONTHS[curIdx];
  document.getElementById('month-label').textContent = `${year}년 ${month}월`;
  document.getElementById('cal-section-title').textContent = `${month}월 캘린더 · 예약 현황`;
  document.getElementById('btn-prev').disabled = curIdx === 0;
  document.getElementById('btn-next').disabled = curIdx === MONTHS.length - 1;
  renderMonthPills();
  rows = []; renderAll();
  fetchAll();
}
function changeMonth(d) { const n = curIdx + d; if (n < 0 || n >= MONTHS.length) return; curIdx = n; onMonthChange(); }

async function fetchAll() {
  setSync('ing');
  const { year, month } = MONTHS[curIdx];
  try { rows = await DB.list(year, month); setSync('ok'); renderAll(); }
  catch (e) { setSync('err'); }
}

// ── 집계 ─────────────────────────────────────────────────
function counts() {
  const c = {};
  for (const t of ['weekday', 'saturday', 'sunday']) {
    c[t] = {
      used: rows.filter(r => r.type === t && (r.status === 'confirmed' || r.status === 'cancel_req')).length,
      pend: rows.filter(r => r.type === t && r.status === 'requested').length,
      limit: CONFIG.LIMITS[t],
    };
  }
  return c;
}

// ── 렌더 ─────────────────────────────────────────────────
function renderAll() { renderCalendar(); renderList(); renderKPI(); renderPending(); }

function pillText(r) {
  if (r.status === 'requested') return { t: `희망 · ${r.req_time || '시간무관'}`, n: r.name || '' };
  if (r.status === 'declined')  return { t: '예약 불가', n: r.req_time || '' };
  if (r.status === 'cancel_req') return { t: `취소요청 ${r.time || ''}`, n: r.name || '' };
  return { t: r.time || '', n: r.name || '' };
}

function renderCalendar() {
  const { year, month } = MONTHS[curIdx];
  const grid = document.getElementById('cal-grid'); grid.innerHTML = '';
  const fd = getDow(year, month, 1), days = daysInMonth(year, month);
  const now = new Date(); const todayKey = now.getFullYear() * 10000 + (now.getMonth() + 1) * 100 + now.getDate();
  for (let i = 0; i < fd; i++) grid.insertAdjacentHTML('beforeend', '<div class="cal-cell empty"></div>');
  for (let day = 1; day <= days; day++) {
    const dow = getDow(year, month, day), hol = getHoliday(year, month, day);
    const key = year * 10000 + month * 100 + day;
    const cell = document.createElement('div');
    cell.className = 'cal-cell' + (dow === 0 ? ' sun' : '') + (dow === 6 ? ' sat' : '') + (hol ? ' holiday' : '') + (key === todayKey ? ' today' : '') + (key < todayKey ? ' past' : '');
    cell.innerHTML = `<div><span class="cal-day">${day}</span>${hol ? `<span class="holiday-label">${esc(hol)}</span>` : ''}</div>`;
    rows.filter(r => r.day === day).forEach(r => {
      const p = document.createElement('div'); const tx = pillText(r);
      p.className = `pill st-${r.status}`;
      p.innerHTML = `<div class="t">${esc(tx.t)}</div>${tx.n ? `<div class="n">${esc(tx.n)}</div>` : ''}`;
      p.title = `${STATUS_KR[r.status]} · ${tx.t} ${tx.n}`;
      p.onclick = e => { e.stopPropagation(); openDetail(r.id); };
      cell.appendChild(p);
    });
    const add = document.createElement('button'); add.className = 'add-btn'; add.textContent = '+'; add.setAttribute('aria-label', `${day}일 등록`);
    add.onclick = e => { e.stopPropagation(); openNew(day); };
    cell.appendChild(add);
    cell.onclick = () => openNew(day);
    grid.appendChild(cell);
  }
  const rem = (7 - (fd + days) % 7) % 7;
  for (let i = 0; i < rem; i++) grid.insertAdjacentHTML('beforeend', '<div class="cal-cell empty"></div>');
}

function renderList() {
  const { year, month } = MONTHS[curIdx];
  const tb = document.getElementById('list-body');
  if (!rows.length) { tb.innerHTML = `<tr><td colspan="8" style="text-align:center;padding:28px;color:#9aabb8;cursor:default">${month}월 예약 내역이 없습니다</td></tr>`; return; }
  tb.innerHTML = [...rows].sort((a, b) => a.day - b.day).map((r, i) => {
    const dow = getDow(year, month, r.day);
    const dc = dow === 0 ? '#e74c3c' : dow === 6 ? '#2980b9' : '#3a4f60';
    const timeCell = r.time ? `<b style="color:#1e8449">${esc(r.time)}</b>` : `<span class="muted">희망: ${esc(r.req_time || '무관')}</span>`;
    const memo = [r.req_note, r.admin_note].filter(Boolean).map(esc).join(' / ');
    return `<tr onclick="openDetail(${r.id})">
      <td class="muted">${String(i + 1).padStart(2, '0')}</td>
      <td>${month}월 ${r.day}일</td>
      <td style="color:${dc};font-weight:700">${DAY_KR[dow]}</td>
      <td><span class="tag type-${r.type}">${TYPE_KR[r.type]}</span></td>
      <td><span class="tag st-${r.status}">${STATUS_SHORT[r.status]}</span></td>
      <td>${timeCell}</td>
      <td>${esc(r.name || '-')}</td>
      <td style="max-width:220px">${memo || '<span class="muted">-</span>'}</td>
    </tr>`;
  }).join('');
}

function renderKPI() {
  const c = counts();
  const totalUsed = c.weekday.used + c.saturday.used + c.sunday.used;
  const totalPend = c.weekday.pend + c.saturday.pend + c.sunday.pend;
  document.getElementById('kpi-total').innerHTML = `${totalUsed} <span>건</span>`;
  document.getElementById('kpi-sub').textContent = `주중 ${c.weekday.used} · 토 ${c.saturday.used} · 일/공휴 ${c.sunday.used}` + (totalPend ? ` · 대기 ${totalPend}` : '');
  const set = (k, t, label) => {
    const x = c[t];
    document.getElementById(`kpi-${k}-label`).textContent = `${label} 잔여 (한도 ${x.limit})`;
    document.getElementById(`kpi-${k}`).innerHTML = `${Math.max(0, x.limit - x.used)} <span>회</span>`;
    document.getElementById(`kpi-${k}-sub`).textContent = `확정 ${x.used}회` + (x.pend ? ` · 희망 대기 ${x.pend}건` : '') + (x.used > x.limit ? ' · 한도 초과' : '');
  };
  set('wd', 'weekday', '주중'); set('sat', 'saturday', '토요일'); set('sun', 'sunday', '일요일/공휴일');
  const fills = { weekday: 'fill-weekday', saturday: 'fill-saturday', sunday: 'fill-sunday' };
  document.getElementById('quota-items').innerHTML = ['weekday', 'saturday', 'sunday'].map(t => {
    const x = c[t]; const base = Math.max(x.limit, x.used + x.pend);
    return `<div class="quota-item">
      <div class="quota-item-label">${t === 'sunday' ? '일/공휴' : TYPE_KR[t]}</div>
      <div class="quota-bar-wrap"><div class="quota-bar-fill ${fills[t]}" style="width:${x.used / base * 100}%"></div><div class="quota-bar-fill fill-pending" style="width:${x.pend / base * 100}%"></div></div>
      <div class="quota-nums"><span class="used">${x.used}</span><span class="total"> / ${x.limit}회</span>${x.pend ? ` <span class="pend">+${x.pend}</span>` : ''}</div>
    </div>`;
  }).join('');
}

function renderPending() {
  const banner = document.getElementById('pending-banner');
  const list = rows.filter(r => IS_ADMIN ? (r.status === 'requested' || r.status === 'cancel_req') : r.status === 'declined');
  if (!list.length) { banner.classList.remove('show'); return; }
  const { year, month } = MONTHS[curIdx];
  document.getElementById('pending-title').textContent = IS_ADMIN
    ? `처리 대기 ${list.length}건 — 클릭해서 확정/불가 처리하세요`
    : `예약 불가 안내 ${list.length}건 — 클릭해서 사유를 확인하세요`;
  document.getElementById('pending-list').innerHTML = list.map(r =>
    `<span class="pending-item" onclick="openDetail(${r.id})"><span class="tag st-${r.status}">${STATUS_SHORT[r.status]}</span>${dateStr(year, month, r.day)} ${esc(r.time || r.req_time || '')}</span>`).join('');
  banner.classList.add('show');
}

// ── 모달 ─────────────────────────────────────────────────
const $ = id => document.getElementById(id);
function openModal(html) { $('modal').innerHTML = html; $('modal-overlay').classList.add('open'); const f = $('modal').querySelector('input:not([readonly]),textarea'); if (f) setTimeout(() => f.focus(), 60); }
function closeModal() { $('modal-overlay').classList.remove('open'); }
$('modal-overlay').addEventListener('click', e => { if (e.target.id === 'modal-overlay') closeModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

const typeSelect = (v, dis) => `<label>구분</label><select id="f-type" ${dis ? 'disabled' : ''}>
  ${['weekday', 'saturday', 'sunday'].map(t => `<option value="${t}" ${t === v ? 'selected' : ''}>${({ weekday: '주중 (월~금)', saturday: '토요일', sunday: '일요일 / 공휴일' })[t]}</option>`).join('')}</select>`;
const field = (id, label, v, ph, ro) => `<label for="${id}">${label}</label><input id="${id}" value="${esc(v)}" placeholder="${esc(ph || '')}" ${ro ? 'readonly' : ''}>`;
const area = (id, label, v, ph, ro) => `<label for="${id}">${label}</label><textarea id="${id}" placeholder="${esc(ph || '')}" ${ro ? 'readonly' : ''}>${esc(v)}</textarea>`;
const chips = (target, list) => `<div class="chips">${list.map(x => `<button type="button" class="chip" onclick="document.getElementById('${target}').value='${x}'">${x}</button>`).join('')}</div>`;
const dateLine = day => { const { year, month } = MONTHS[curIdx]; return `${year}년 ${month}월 ${day}일 (${DAY_KR[getDow(year, month, day)]})`; };

function quotaWarn(type, extra) {
  const x = counts()[type];
  const n = x.used + (extra === 'withPending' ? x.pend : 0);
  if (n >= x.limit) return `<div class="warn-box">⚠ 이번 달 ${TYPE_KR[type]} 한도 ${x.limit}회 중 확정 ${x.used}회${x.pend ? ` · 대기 ${x.pend}건` : ''} — 한도를 초과합니다.</div>`;
  return '';
}

// 날짜 클릭 → 신규

    openModal(`<h3>${month}월 ${day}일 확정 예약 등록</h3>
      <div class="status-line">골프장 예약이 완료된 건을 직접 등록합니다. 저장 시 대표님께 확정 메일이 발송됩니다.</div>
      ${quotaWarn(t)}
      ${field('f-date', '날짜', dateLine(day), '', true)}

      ${chips('f-time', ['07시00분', '08시00분', '12시00분'])}
      ${field('f-name', '예약자', CONFIG.CEO_NAME, '예) ' + CONFIG.CEO_NAME)}
      ${typeSelect(t)}
      ${area('f-anote', '담당자 메모 (선택)', '', '예) 2팀 / 카트 포함 등')}

  } else {
    openModal(`<h3>${month}월 ${day}일 희망일정 등록</h3>
      <div class="status-line">등록하시면 담당자(${esc(CONFIG.ADMIN_NAME)})에게 알림메일이 발송되고, 예약이 확정되면 메일로 안내드립니다.</div>
      ${quotaWarn(t, 'withPending')}
      ${field('f-date', '날짜', dateLine(day), '', true)}
      ${field('f-reqtime', '희망 시간대', '', '예) 오전 8시 전후')}
      ${chips('f-reqtime', ['오전 이른 시간', '오전', '점심 전후', '오후', '시간 무관'])}
      ${field('f-name', '예약자', CONFIG.CEO_NAME, '')}
      ${area('f-rnote', '요청 메모 (선택)', '', '예) 4인 / 동반자 ○○○ 대표')}
      ${typeSelect(t)}
      <div class="modal-btns"><button class="b-plain" onclick="closeModal()">취소</button><button class="b-primary" id="b-go" onclick="ceoCreate(${day})">희망일정 등록</button></div>`);
  }
}

// 예약 클릭 → 상세
function openDetail(id) {
  const r = rows.find(x => x.id === id); if (!r) return;
  const { month } = MONTHS[curIdx];
  const head = `<h3>${month}월 ${r.day}일 · ${STATUS_KR[r.status]}</h3><div class="status-line">${dateLine(r.day)} · ${TYPE_KR[r.type]}</div>`;
  const reqInfo = (r.req_time || r.req_note) ? `<div class="info-box"><b>대표님 요청</b><br>희망 시간대: ${esc(r.req_time || '-')}${r.req_note ? `<br>메모: ${esc(r.req_note)}` : ''}</div>` : '';
  let body = '', btns = '';

  if (IS_ADMIN) {
    if (r.status === 'requested') {
      body = `${reqInfo}${quotaWarn(r.type)}
        ${field('f-time', '확정 티타임', r.time || '', '예) 08시00분')}
        ${chips('f-time', ['07시00분', '08시00분', '12시00분'])}
        ${field('f-name', '예약자', r.name || CONFIG.CEO_NAME)}
        ${typeSelect(r.type)}
        ${area('f-anote', '담당자 메모 / 불가 사유', r.admin_note || '', '확정 시 참고사항, 불가 시 사유')}`;
      btns = `<button class="b-warn" onclick="adminDecline(${id})">예약 불가</button><button class="b-primary" id="b-go" onclick="adminConfirm(${id})">예약 확정</button>`;
    } else if (r.status === 'confirmed') {
      body = `${reqInfo}
        ${field('f-time', '티타임', r.time || '')}
        ${field('f-name', '예약자', r.name || '')}
        ${typeSelect(r.type)}
        ${area('f-anote', '담당자 메모', r.admin_note || '')}`;
      btns = `<button class="b-warn" onclick="adminRemove(${id}, '예약 취소')">예약 취소</button><button class="b-primary" id="b-go" onclick="adminEdit(${id})">변경 저장</button>`;
    } else if (r.status === 'cancel_req') {
      body = `<div class="info-box"><b>대표님 취소 요청</b><br>티타임 ${esc(r.time || '-')} · ${esc(r.name || '')}${r.req_note ? `<br>메모: ${esc(r.req_note)}` : ''}</div>
        ${area('f-anote', '담당자 메모', r.admin_note || '')}`;
      btns = `<button class="b-blue" onclick="adminRejectCancel(${id})">취소 불가 (유지)</button><button class="b-warn" onclick="adminRemove(${id}, '취소 완료')">골프장 취소 완료</button>`;
    } else {
      body = `${reqInfo}<div class="info-box">불가 사유: ${esc(r.admin_note || '-')}</div>`;
      btns = `<button class="b-warn" onclick="silentRemove(${id})">목록에서 삭제</button>`;
    }
    btns += `<button class="b-plain" onclick="closeModal()">닫기</button>`;
  } else {
    if (r.status === 'requested') {
      body = `<div class="status-line" style="margin-top:-8px">담당자가 예약을 진행 중입니다. 확정되면 메일로 안내드립니다.</div>
        ${field('f-reqtime', '희망 시간대', r.req_time || '')}
        ${chips('f-reqtime', ['오전 이른 시간', '오전', '점심 전후', '오후', '시간 무관'])}
        ${field('f-name', '예약자', r.name || '')}
        ${area('f-rnote', '요청 메모', r.req_note || '')}`;
      btns = `<button class="b-warn" onclick="ceoWithdraw(${id})">희망 철회</button><button class="b-primary" id="b-go" onclick="ceoEdit(${id})">수정 저장</button>`;
    } else if (r.status === 'confirmed') {
      body = `<div class="info-box" style="font-size:14px"><b>티타임 ${esc(r.time || '-')}</b><br>예약자: ${esc(r.name || '-')}${r.admin_note ? `<br>메모: ${esc(r.admin_note)}` : ''}</div>
        ${area('f-rnote', '취소 요청 시 메모 (선택)', '', '예) 일정 변경으로 취소 부탁')}`;
      btns = `<button class="b-warn" onclick="ceoCancelReq(${id})">취소 요청</button>`;
    } else if (r.status === 'cancel_req') {
      body = `<div class="info-box">취소 요청을 접수했습니다. 담당자가 골프장 취소를 진행 중입니다.<br>티타임 ${esc(r.time || '-')}</div>`;
    } else {
      body = `${reqInfo}<div class="warn-box">예약 불가 사유: ${esc(r.admin_note || '-')}</div>`;
      btns = `<button class="b-warn" onclick="silentRemove(${id})">확인 (삭제)</button>`;
    }
    btns += `<button class="b-plain" onclick="closeModal()">닫기</button>`;
  }
  openModal(head + body + `<div class="modal-btns">${btns}</div>`);
}

// ── 액션 ─────────────────────────────────────────────────
const val = id => ($(id) ? $(id).value.trim() : '');
async function run(fn) {
  const btns = $('modal').querySelectorAll('.modal-btns button'); btns.forEach(b => b.disabled = true);
  setSync('ing');
  try { await fn(); closeModal(); await fetchAll(); }
  catch (e) { alert('저장 실패: ' + e.message); setSync('err'); btns.forEach(b => b.disabled = false); }
}
const subjDate = day => { const { year, month } = MONTHS[curIdx]; return dateStr(year, month, day); };

// 대표님
function ceoCreate(day) {
  const { year, month } = MONTHS[curIdx];
  const d = { year, month, day, type: val('f-type') || $('f-type').value, status: 'requested', req_time: val('f-reqtime'), req_note: val('f-rnote'), name: val('f-name') || CONFIG.CEO_NAME };
  run(async () => { const r = await DB.insert(d); notify('admin', `희망일정 등록 ${subjDate(day)} ${d.req_time}`, ['대표님이 희망일정을 등록했습니다.', '', ...describe(r || d)]); });
}
function ceoEdit(id) {
  const r = rows.find(x => x.id === id);
  const d = { req_time: val('f-reqtime'), req_note: val('f-rnote'), name: val('f-name') };
  run(async () => { await DB.update(id, d); notify('admin', `희망일정 수정 ${subjDate(r.day)}`, ['대표님이 희망일정을 수정했습니다.', '', ...describe({ ...r, ...d })]); });
}
function ceoWithdraw(id) {
  const r = rows.find(x => x.id === id);
  if (!confirm('이 희망일정을 철회하시겠습니까?')) return;
  run(async () => { await DB.remove(id); notify('admin', `희망일정 철회 ${subjDate(r.day)}`, ['대표님이 희망일정을 철회했습니다.', '', ...describe(r)]); });
}
function ceoCancelReq(id) {
  const r = rows.find(x => x.id === id);
  if (!confirm('담당자에게 이 예약의 취소를 요청하시겠습니까?')) return;
  const note = val('f-rnote');
  run(async () => { await DB.update(id, { status: 'cancel_req', req_note: note || r.req_note }); notify('admin', `취소 요청 ${subjDate(r.day)} ${r.time || ''}`, ['대표님이 확정 예약의 취소를 요청했습니다.', '', ...describe({ ...r, req_note: note || r.req_note })]); });
}

// 담당자
function adminCreate(day) {
  const { year, month } = MONTHS[curIdx];
  const time = val('f-time'), name = val('f-name');
  if (!time || !name) { alert('티타임과 예약자를 입력해 주세요.'); return; }
  const d = { year, month, day, type: $('f-type').value, status: 'confirmed', time, name, admin_note: val('f-anote') };
  run(async () => { const r = await DB.insert(d); notify('ceo', `예약 확정 ${subjDate(day)} ${time}`, ['골프장 예약이 확정되었습니다.', '', ...describe(r || d)]); });
}
function adminConfirm(id) {
  const r = rows.find(x => x.id === id);
  const time = val('f-time'), name = val('f-name');
  if (!time || !name) { alert('확정 티타임과 예약자를 입력해 주세요.'); return; }
  const d = { status: 'confirmed', time, name, type: $('f-type').value, admin_note: val('f-anote') };
  const x = counts()[d.type];
  if (x.used >= x.limit && !confirm(`${TYPE_KR[d.type]} 한도(${x.limit}회)를 초과합니다. 그래도 확정할까요?`)) return;
  run(async () => { await DB.update(id, d); notify('ceo', `예약 확정 ${subjDate(r.day)} ${time}`, ['요청하신 희망일정의 골프장 예약이 확정되었습니다.', '', ...describe({ ...r, ...d })]); });
}
function adminDecline(id) {
  const r = rows.find(x => x.id === id);
  const reason = val('f-anote');
  if (!reason) { alert('담당자 메모 칸에 불가 사유를 입력해 주세요.'); $('f-anote').focus(); return; }
  run(async () => { await DB.update(id, { status: 'declined', admin_note: reason }); notify('ceo', `예약 불가 ${subjDate(r.day)}`, ['요청하신 일정은 예약이 어렵습니다.', '', ...describe({ ...r, admin_note: reason, time: null })]); });
}
function adminEdit(id) {
  const r = rows.find(x => x.id === id);
  const d = { time: val('f-time'), name: val('f-name'), type: $('f-type').value, admin_note: val('f-anote') };
  if (!d.time || !d.name) { alert('티타임과 예약자를 입력해 주세요.'); return; }
  const changed = d.time !== (r.time || '') || d.name !== (r.name || '');
  run(async () => { await DB.update(id, d); if (changed) notify('ceo', `예약 변경 ${subjDate(r.day)} ${d.time}`, ['확정 예약 내용이 변경되었습니다.', `(변경 전: ${r.time || '-'} / ${r.name || '-'})`, '', ...describe({ ...r, ...d })]); else toast('저장되었습니다'); });
}
function adminRemove(id, label) {
  const r = rows.find(x => x.id === id);
  if (!confirm(`${label} 처리하고 목록에서 삭제할까요? (대표님께 취소 메일 발송)`)) return;
  run(async () => { await DB.remove(id); notify('ceo', `예약 취소 ${subjDate(r.day)} ${r.time || ''}`, ['아래 예약이 취소 처리되었습니다.', '', ...describe(r)]); });
}
function adminRejectCancel(id) {
  const r = rows.find(x => x.id === id);
  const note = val('f-anote');
  if (!note) { alert('담당자 메모에 사유를 입력해 주세요. (예: 취소 기한 경과)'); return; }
  run(async () => { await DB.update(id, { status: 'confirmed', admin_note: note }); notify('ceo', `취소 불가 안내 ${subjDate(r.day)} ${r.time || ''}`, ['요청하신 예약 취소가 어려워 예약이 유지됩니다.', '', ...describe({ ...r, admin_note: note })]); });
}
function silentRemove(id) {
  if (!confirm('목록에서 삭제할까요?')) return;
  run(async () => { await DB.remove(id); });
}

// ── 시작 ─────────────────────────────────────────────────
initHeader();
onMonthChange();
setInterval(() => { if (!$('modal-overlay').classList.contains('open')) fetchAll(); }, 30000);
</script>
</body>
</html>
